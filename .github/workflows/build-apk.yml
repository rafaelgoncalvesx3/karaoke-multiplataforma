name: Gerar APK Android TV

on:
  push:
    branches: [main, master]
    paths:
      - '03_Android_TV/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter projeto
        uses: actions/checkout@v4
      - name: Verificar fontes Android
        run: |
          test -f 03_Android_TV/settings.gradle
          test -f 03_Android_TV/app/build.gradle
          test -f 03_Android_TV/app/src/main/AndroidManifest.xml
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar SDK Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK
        working-directory: 03_Android_TV
        run: gradle --no-daemon :app:assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: KaraokeTV-Android-APK
          path: 03_Android_TV/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
