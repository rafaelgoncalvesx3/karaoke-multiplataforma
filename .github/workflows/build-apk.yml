name: Gerar APK Android TV

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build-apk.yml'
      - '.ci/source.part*.b64'
      - '03_Android_TV/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Publicar fontes e compilar APK
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Restaurar as três versões do Karaoke
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/source.part*.b64 | base64 --decode > /tmp/karaoke-fontes.tar.xz
          echo "d3dcba5b000044605bee62d4fa8362cf7288db3ed7e92e8472ebfae47a416137  /tmp/karaoke-fontes.tar.xz" | sha256sum --check -
          tar -xJf /tmp/karaoke-fontes.tar.xz
          python3 tools/generate_sample_audio.py
          test -f 01_Console_NET/Program.cs
          test -f 02_Instalador_Windows/INSTALAR_NO_WINDOWS.cmd
          test -f 03_Android_TV/settings.gradle
          test -f 03_Android_TV/app/build.gradle
          test -f 03_Android_TV/app/src/main/AndroidManifest.xml

      - name: Publicar pastas completas no GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md .gitignore tools/ 01_Console_NET/ 02_Instalador_Windows/ 03_Android_TV/
          if ! git diff --cached --quiet; then
            git commit -m "Publica código e amostras das três versões do Karaoke"
            git push origin HEAD:main
          fi

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Testar algoritmos Android
        shell: bash
        run: |
          mkdir -p /tmp/karaoke-java-test
          javac -d /tmp/karaoke-java-test \
            03_Android_TV/app/src/main/java/br/com/karaoketv/Yin.java \
            03_Android_TV/app/src/main/java/br/com/karaoketv/ScoreEngine.java \
            03_Android_TV/app/src/main/java/br/com/karaoketv/UltraStar.java \
            03_Android_TV/tests/TestAlgorithms.java
          java -cp /tmp/karaoke-java-test TestAlgorithms

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compilar APK Android TV
        working-directory: 03_Android_TV
        run: gradle --no-daemon :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: KaraokeTV-Android-APK
          path: 03_Android_TV/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
